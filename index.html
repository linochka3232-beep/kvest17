<style>
:root{--paper:#f4ecd8;--ink:#2c2418;--red:#8b2020;--line:#c9b98a;--card:#fdf8ea;--ok:#2e6b34;--bad:#a12b2b}
*{box-sizing:border-box}
body{margin:0;background:#3b342a;color:var(--ink);font-family:"Courier New",monospace;line-height:1.5}
#app{max-width:860px;margin:0 auto;padding:12px}
.sheet{background:var(--paper);border:2px solid var(--line);border-radius:6px;padding:18px 20px;box-shadow:0 6px 18px rgba(0,0,0,.45)}
h1,h2,h3{font-family:Georgia,serif;color:var(--red);margin:.2em 0}
.small{font-size:.86em;opacity:.85}
.stamp{display:inline-block;border:2px solid var(--red);color:var(--red);border-radius:4px;padding:2px 10px;transform:rotate(-2deg);font-weight:bold;letter-spacing:1px}
.header{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.header .title{font-family:Georgia,serif;color:#f4ecd8;font-weight:bold;flex:1;min-width:200px}
.clock{background:var(--paper);border:2px solid var(--line);border-radius:4px;padding:2px 10px;font-weight:bold}
button{font-family:inherit;font-size:1em;background:#efe4c6;border:2px solid var(--ink);border-radius:4px;padding:8px 14px;cursor:pointer;color:var(--ink)}
button:hover{background:#e6d7ae}
button.primary{background:var(--red);color:#fff;border-color:var(--red)}
button:disabled{opacity:.45;cursor:not-allowed}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.tabs button{flex:1;min-width:130px}
.tabs button.active{background:var(--ink);color:var(--paper)}
input[type=text],input[type=number]{font-family:inherit;font-size:1.05em;padding:8px 10px;border:2px solid var(--ink);border-radius:4px;background:#fffdf5;width:100%}
label.radio{display:block;border:1px solid var(--line);border-radius:6px;padding:10px;margin:8px 0;background:var(--card);cursor:pointer}
label.radio.sel{outline:3px solid var(--red)}
.field{margin:10px 0}
.evtitle{font-weight:bold;color:var(--red)}
.evplace{font-size:.9em;opacity:.85;font-style:italic;margin-bottom:8px}
.evbody p{margin:.6em 0;white-space:pre-wrap}
table{border-collapse:collapse;width:100%;margin:8px 0;font-size:.92em;background:#fffdf5}
th,td{border:1px solid var(--ink);padding:4px 7px;text-align:left}
th{background:#efe4c6}
.qbox{border:1px solid var(--line);border-radius:6px;background:var(--card);padding:12px;margin:10px 0}
.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:9px 12px;border:1.5px solid var(--ink);border-radius:5px;background:#fffdf5}
.opt:hover{background:#f1e7cd}
.opt.correct{border-color:var(--ok);background:#e2efe2}
.opt.wrong{border-color:var(--bad);background:#f3dede}
.fb{border-left:4px solid var(--ink);padding:6px 10px;margin:8px 0;background:#fffdf5}
.fb.ok{border-color:var(--ok)}
.fb.bad{border-color:var(--bad)}
.done-step{opacity:.8}
.locked-step{opacity:.5;font-size:.9em}
.sticker{display:inline-block;min-width:64px;text-align:center;border:2px dashed var(--ink);border-radius:6px;padding:6px 8px;margin:4px;background:#fffdf5;cursor:pointer}
.sticker.locked{opacity:.4;cursor:not-allowed}
.sticker.current{border-color:var(--red);background:#f6e3d0}
.sticker.open{background:#e2efe2;border-style:solid}
.dossier{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px}
.dcard{border:1px solid var(--line);border-radius:6px;padding:10px;background:var(--card)}
.dcard b{color:var(--red)}
.doc{border-top:2px solid var(--line);margin-top:14px;padding-top:8px}
.msg{margin:8px 0;padding:8px 10px;border-radius:5px;display:none}
.msg.err{display:block;background:#f3dede;border:1.5px solid var(--bad)}
.msg.okm{display:block;background:#e2efe2;border:1.5px solid var(--ok)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:flex-start;justify-content:center;padding:20px;overflow:auto;z-index:50}
.overlay .sheet{max-width:640px;width:100%}
#err{display:none;position:fixed;left:0;right:0;bottom:0;background:#7a1f1f;color:#fff;padding:8px 14px;font-size:.9em;z-index:99}
.checkrow{border:1px solid var(--line);border-radius:6px;padding:10px;margin:8px 0;background:var(--card)}
.checkrow b{color:var(--red)}
</style>
</head>

 "LETTER": "ШТАБ ПРАЗДНОВАНИЯ 50-ЛЕТИЯ ШКОЛЫ № 2 Г. КУЗНЕЦКА.\n25 мая 1988 года. Секретно.\n\nВчера, 24 мая, в период с 19:00 до 21:00 из школы пропал бронзовый колокольчик — реликвия выпускников 1968 года. Завтра, 26-го, юбилей и Последний колокольчик — без реликвии линейку начинать нельзя. Совещание у директора — после того, как все группы завершат обход.\n\nВЫ ВПИСАНЫ В ЭКСПЕРИМЕНТ ШТАБА. По школам Кузнецка таких групп три — и у каждой свой район и своя главная версия. Всего по делу проходят ТРИ ГЛАВНЫХ ПОДОЗРЕВАЕМЫХ:\n— Наталья Викторовна Морозова, организатор внеклассной работы;\n— Олег Борисович Ершов, учитель химии;\n— Пётр Сергеевич, учитель физики.\n\nВАША ВЕРСИЯ: <SUSPECT>. Ваш район: <ZONES>.\nДвери остальных районов опечатаны штабом. Следственную лестницу проходите по порядку: улика за уликой, вопрос за вопросом. Тупиковые ходы бракуйте сами — штаб проверит.\n\nУдачи. Дело №13.",

 "MAP_DOC": "КАРТА ШКОЛЫ № 2 — ЗОНЫ И ОПЕЧАТАННЫЕ ДВЕРИ\n\nВАШ РАЙОН: <ZONES>.\n\nОпечатано штабом:\n— буфет, проходная, кабинет директора, подсобка уборщицы (маршрут 1);\n— кабинет химии с лабораторией, учительская, архив (маршрут 2);\n— библиотека, кабинет физики, актовый зал, кладовая (маршрут 3).\n\nВход в чужую зону — нарушение следственной дисциплины. Терминал двери для вас запирает.\nАктовый зал: сцена, левая кулиса — сундук (по схеме — с прохода не виден). Кладовая — дверь рядом со сценой.",
 "MEMO": "ПАМЯТКА ВЕДУЩЕГО (служебная, не показывать группам)\n\n1. ИСТИНА: колокольчик не крали и не прятали «навсегда» — Витя Лапин вернул его туда, где он хранился до 1968 года: в сундук кладовой реквизита. Он читал брошюру 1968 года (подчёркивал строки про сундук) и знал, где реликвия «начиналась». Он НЕ ЗНАЛ, что по записке директора химик должен был отнести колокольчик лично директору до 19:00 — об этом он узнал только в кабинете директора. Мотив: три недели репетировал реплику, которую утром вычеркнули. Хотел, чтобы линейка не началась, — «пусть заметят, что меня не слышат».\n\n2. Хронометраж 24 мая (канонический):\n11:00–11:40 — утренний замер колокольчика у физика (тон 660 Гц) — №20, №17/№18\n14:00 — химик получает колокольчик по расписке — №27, №6\n15:30–16:45 — опыт №12 на микропробах — №6\n16:45 — замечена царапина (по кабинетным часам «17:10»), фото в сейф — №6, №28, №21\n16:50–16:55 — двое из 11-А в буфете — №1, №2, №29 (в новой редакции — только у группы 1 из.buffered нет: фигура вечером)\n18:30–18:40 — повторный опыт: Таня + Витя (напросился, халат №2) — №6, №30, №14\n18:40 — колокольчик упакован в коробку из кладовой — №6\n18:40 — Таню забирают на прогон (конверт Тани)\n~18:45 — организатор уходит за ворота — №3, №32\n~19:00 — Ершов встречает завуча, уходит помогать; лаборатория пустая — №6\n~19:00–19:05 — фигура в белом халате с коробкой: буфет, коридор, кладовая; колокольчик — в сундук — №2, №3, №4, №25\n19:12 — чек в «Кузнецке»: организатор у кассы — №32\n19:15 — Ершов вернулся — колокольчика нет — №6; 19:15–20:00 — ищет сам, потом докладывает директору\n~19:30 — организатор возвращается в школу — №10\n21:00 — Марина Львовна (Соколова) объявляет в буфете про колокольчик — №2\n\n3. Три главных подозреваемых объявлены группам заранее — по одной заведомо ложной версии на группу:\n— группа 1 строит дело против организатора Морозовой;\n— группа 2 — против химика Ершова;\n— группа 3 — против физика Петра Сергеевича.\nИмя Вити Лапина в уликах НЕ ЗВУЧИТ: только приметы (171 см, худой, белый халат №2, коробка, «напросился помощником»). Имя впервые звучит в конверте Тани Крыловой на совещании.\n\n4. Разрушение версий на совещании (перекрёстная сверка):\n— версия 1 (организатор) рушится чеком №32 (маршрут 2): в 19:12 она у кассы «Кузнецка»;\n— версия 3 (физик) рушится фото часов №21 (маршрут 3): часы спешат на 25 минут, «эксперимент окончен — 17:10» по точному времени — 16:45, дальше он ушёл за батарейкой, в момент пропажи его не было в школе;\n— версия 2 (химик) рушится показаниями уборщицы №4 (маршрут 1): фигура у кладовой — метр семьдесят, химик — 180.\n\n5. Остаётся одна ниточка: помощник старосты по повторному опыту — тот, кого никто не назначал.\n\n6. Финал: Шаг 1 — конверт Тани: «Витя Лапин напросился сам… сказал: „Отнесу сам“». Шаг 2 — группы выбирают виновного из досье (все тринадцать действующих персонажей). Верный ответ — Лапин: мотив (вырезанная реплика), возможность (был в лаборатории 18:30–18:40), знание (брошюра), приметы (халат №2, отпечаток в пыли, фигура ~170). Шаг 3 — где колокольчик? В сундуке кладовой (реквизит заранее).\n\n7. Развязка: монолог Вити («Я три недели готовил одну строчку…») и слова директора: «Реплику вернём. Завтра — первым словом линейки. А колокольчик ты и понесёшь. Сам. И поставишь на место — перед всей школой».\n\nИтого: 33 улики — маршрут 1 (10 предметов), маршрут 2 (12), маршрут 3 (11).",

  "convert": "КОНВЕРТ С ПОКАЗАНИЯМИ Т. КРЫЛОВОЙ (вскрыт штабом)\n\n«Я, Крылова Тамара, староста 11-А, показываю добровольно.\nВечером 24 мая я помогала Олегу Борисовичу на повторном опыте. До меня и после меня в лаборатории был ещё один — ученик нашего класса. Он НАПРОСИЛСЯ сам: приходил в прошлый четверг, просился помочь, сказал, что хочет видеть, как проверяют реликвию. Мне его в помощники никто не назначал, и я его не просила.\nКогда я сказала, что после опыта колокольчик отнесут директору, он сказал: „Отнесу сам“. Я подумала — так положено.\nХалат №2 ему дал Олег Борисович — со слов меня, я сама в журнале не писала.\nВ 18:40 меня забрали на генеральный прогон. Больше я его не видела.\n\nВитю Лапина я всё это время уговаривала успокоиться: реплику вычеркнули утром, он три недели её репетировал. Я боялась, что он что-нибудь выкинет.\n\n25 мая 1988 г. Т. Крылова»\n\nПометка штаба: помощник на опыт получен самовольно. Имя — впервые называет староста.",

const SKEY='delo13_state_v4';

function showErr(t){const e=document.getElementById('err');e.style.display='block';e.textContent='⚠ Сбой терминала: '+t+' — сообщите ведущему.';}
window.onerror=function(msg,src,line){showErr(msg+' (строка '+line+')');return false;};

let S=null;
function save(){try{localStorage.setItem(SKEY,JSON.stringify(S));}catch(e){}}
function loadSaved(){try{const s=localStorage.getItem(SKEY);if(s){const o=JSON.parse(s);if(o&&o.route)return o;}}catch(e){}return null;}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function R(){return DATA.ROUTES[S.route];}
function E(n){return DATA.evid.find(e=>e.num===String(n));}

function bodyHTML(ev){
  let h='';
  for(const [k,v] of ev.body){
    if(k==='p'){h+='<p>'+esc(v)+'</p>';}
    else{h+='<table><tr>'+v[0].map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>';
      for(let i=1;i<v.length;i++){h+='<tr>'+v[i].map(c=>'<td>'+esc(c)+'</td>').join('')+'</tr>';}
      h+='</table>';}
  }
  return h;
}

/* ---------- СТАРТОВЫЙ ЭКРАН ---------- */

  h+='<p>Вчера, 24 мая, между 19:00 и 21:00 из школы пропал бронзовый колокольчик — реликвия выпускников 1968 года. Зоны опечатаны. Совещание у директора — когда все группы завершат обход.</p>';
  h+='<div class="field"><label><b>Название следственной группы:</b></label><input type="text" id="teamIn" maxlength="30" placeholder="Например: Группа «Маяк»"></div>';
  const rd=[['1','Маршрут 1 — «Виновата организатор»',DATA.ROUTES[1]],

  }
  h+='</div>';
  h+='<div class="msg" id="startErr"></div>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap"><button class="primary" id="goBtn">Начать дело →</button>';
  if(saved){h+='<button id="contBtn">Продолжить незавершённое дело («'+esc(saved.team)+'», маршрут '+saved.route+')</button>';}

function bindStart(){
  document.getElementById('goBtn').onclick=function(){
    const team=document.getElementById('teamIn').value.trim();
    const r=document.querySelector('input[name=rt]:checked');
    const err=document.getElementById('startErr');err.className='msg';
    if(!team){err.textContent='Сначала впишите название группы.';err.className='msg err';return;}
    if(!r){err.textContent='Введите цифру маршрута: 1, 2 или 3.';err.className='msg err';return;}
    S={team:team,route:parseInt(r.value),confirming:true,lid:0,answers:{},opened:[],fixed:false,tab:'codes',curEvid:null,meet:null,susHint:null,susOK:null};
    save();render();
  };
  const c=document.getElementById('contBtn');
  if(c)c.onclick=function(){S=loadSaved();render();};
}

    document.querySelectorAll('.tabs button').forEach(b=>b.onclick=function(){S.tab=b.dataset.tab;S.curEvid=null;save();render();});
  }
  if(S.view==='folder')renderFolder();
  else if(S.view==='evview')renderEvView();

/* ---------- ПОЛЕ И КОДЫ ---------- */
function renderCodes(){
  const c=document.getElementById('content');
  let h='<div class="sheet"><h3>Поле и коды</h3>';
  h+='<p class="small">Введите номер улики (по стикеру) — терминал вскроет дело. Чужие районы опечатаны штабом; забегать вперёд по лестнице нельзя.</p>';
  h+='<div style="display:flex;gap:8px;flex-wrap:wrap"><input type="text" id="codeIn" placeholder="Например: 3" style="flex:1;min-width:180px"><button class="primary" id="codeGo">Открыть</button></div>';
  h+='<div class="msg" id="codeMsg"></div>';
  h+='<h3>Стикеры вашего района</h3><div>';
  R().nums.forEach((n,i)=>{
    const opened=S.opened.includes(n);
    const cls='sticker'+(opened?' open':(i===S.lid?' current':' locked'));
    h+='<span class="'+cls+'" data-n="'+n+'" data-i="'+i+'">№'+n+(opened?' ✓':'')+'</span>';
  });
  h+='</div><p class="small">✓ — улика в папке. Подсвечен текущий шаг следственной лестницы.</p>';
  if(S.curEvid){const ev=E(S.curEvid);h+='<div class="doc"><h3>'+esc(ev.title)+' — №'+ev.num+'</h3><div class="evplace">'+esc(ev.place)+'</div><div class="evbody">'+bodyHTML(ev)+'</div></div>';}
  h+='</div>';
  c.innerHTML=h;
  const inp=document.getElementById('codeIn');
  const go=function(){submitCode();};
  document.getElementById('codeGo').onclick=go;
  inp.onkeydown=function(e){if(e.key==='Enter')go();};
  c.querySelectorAll('.sticker').forEach(st=>{
    st.onclick=function(){
      const n=st.dataset.n,i=parseInt(st.dataset.i);
      if(!S.opened.includes(n)&&i>S.lid){msg('codeMsg','Забегать вперёд нельзя: следственная лестница не дошла до этой улики. Разбирайте текущий шаг.','err');return;}
      S.curEvid=n;save();render();
    };
  });
}
function submitCode(){
  const v=document.getElementById('codeIn').value.trim();
  const m=document.getElementById('codeMsg');
  if(!v){m.textContent='Введите номер улики или код.';m.className='msg err';return;}
  if(v.toUpperCase()==='СОВЕЩАНИЕ'){
    if(!S.fixed){m.textContent='Совещание откроется, когда ваша версия будет зафиксирована (после всей следственной лестницы).';m.className='msg err';return;}
    S.meet='checks';save();render();return;
  }
  const n=v.replace(/\D/g,'');
  if(!E(n)){m.textContent='Нет такой улики. Проверьте номер на стикере.';m.className='msg err';return;}
  if(!R().nums.includes(n)){m.textContent='Дверь опечатана штабом: эта улика — чужого района. Работайте по своей зоне.';m.className='msg err';return;}
  const i=R().nums.indexOf(n);
  if(!S.opened.includes(n)&&i>S.lid){m.textContent='Забегать вперёд нельзя: следственная лестница не дошла до этой улики.';m.className='msg err';return;}
  S.curEvid=n;if(!S.opened.includes(n))S.opened.push(n);save();render();
}
function msg(id,t,cls){const m=document.getElementById(id);if(!m)return;m.textContent=t;m.className='msg '+(cls||'err');}

/* ---------- ВОПРОСЫ (лестница с вариантами) ---------- */
function renderQuestions(){
  const c=document.getElementById('content');
  let h='<div class="sheet"><h3>Следственная лестница — вопросы</h3>';
  h+='<p class="small">Каждый вопрос открыт по порядку. Выберите вариант ответа: неверный — терминал объяснит, почему мимо; верный — откроет следующий шаг. Перед ответом вскройте улику в «Поле и коды».</p>';
  R().nums.forEach((n,i)=>{
    const ev=E(n);const q=DATA.Q[n];
    const st='div class="qbox"';
    if(i<S.lid){
      const ans=S.answers[n];
      const okOpt=q.opts[ans][0];
      h+='<div class="qbox done-step"><b>✓ Шаг '+(i+1)+' · улика №'+n+' — '+esc(ev.title)+'</b><p>'+esc(q.q)+'</p><div class="fb ok"><b>Терминал:</b> '+esc(okOpt)+'</div><div class="fb ok">'+esc(q.opts[ans][2])+'</div></div>';
    }else if(i===S.lid){
      h+='<div class="qbox"><b>Шаг '+(i+1)+' · улика №'+n+' — '+esc(ev.title)+'</b><div class="evplace">'+esc(ev.place)+'</div>';
      if(!S.opened.includes(n)){
        h+='<p>Вопрос откроется после того, как улика окажется в папке. Сначала вскройте её.</p><button class="primary" data-open="'+n+'">Вскрыть улику №'+n+'</button></div>';
      }else{
        h+='<p style="font-family:Georgia,serif;font-size:1.05em">'+esc(q.q)+'</p>';
        q.opts.forEach((o,idx)=>{h+='<button class="opt" data-n="'+n+'" data-i="'+idx+'">'+esc(o[0])+'</button>';});
        h+='<div id="fb_'+n+'"></div></div>';
      }
    }else{
      h+='<div class="qbox locked-step">🔒 Шаг '+(i+1)+' · улика №'+n+' — откроется после разбора предыдущего</div>';
    }
  });
  h+='</div>';
  c.innerHTML=h;
  c.querySelectorAll('button[data-open]').forEach(b=>b.onclick=function(){
    const n=b.dataset.open;S.curEvid=n;if(!S.opened.includes(n))S.opened.push(n);S.tab='codes';save();render();
  });
  c.querySelectorAll('button.opt').forEach(b=>b.onclick=function(){
    const n=b.dataset.n,idx=parseInt(b.dataset.i);const q=DATA.Q[n];const o=q.opts[idx];
    if(o[1]){
      S.answers[n]=idx;S.lid++;
      if(S.lid>=R().nums.length){S.fixed=true;}
      save();render();
    }else{
      const fb=document.getElementById('fb_'+n);
      fb.innerHTML='<div class="fb bad"><b>Терминал:</b> '+esc(o[2])+'</div>';
      b.classList.add('wrong');
      c.querySelectorAll('button.opt[data-n="'+n+'"]').forEach(x=>x.classList.remove('correct'));
    }
  });
}

  }else if(S.meet==='suspect'){
    h+='<h2>Кто виновен?</h2><p>'+esc(M.suspect_q)+'</p><div class="dossier">';
    DATA.DOSSIER.forEach((d,i)=>{h+='<button class="opt" data-sus="'+i+'"><b>'+esc(d[0])+'</b> — '+esc(d[1])+', '+esc(d[2])+'</button>';});
    h+='</div>';
    if(S.susHint){h+='<div class="fb bad"><b>Совещание:</b> '+esc(S.susHint)+'</div>';}
    h+='<div id="fb_sus"></div>';
  }else if(S.meet==='place'){
    h+='<h2>Где колокольчик?</h2><p>'+esc(M.place_q)+'</p>';
    M.place_opts.forEach((o,i)=>{h+='<button class="opt" data-pl="'+i+'">'+esc(o[0])+'</button>';});
    h+='<div id="fb_pl"></div>';
  }else if(S.meet==='done'){
    h+='<h2>Развязка</h2><div class="evbody">'+M.finale.split('\n').map(x=>'<p>'+esc(x)+'</p>').join('')+'</div>';
    h+='<p><span class="stamp">Дело №13 закрыто</span></p><button id="mBack">Вернуться к делу</button>';
  }
  h+='</div>';
  c.innerHTML=h;
  const nx=document.getElementById('mNext');
  if(nx)nx.onclick=function(){
    if(S.meet==='checks'){S.meet='convert';}
    else if(S.meet==='convert'){S.meet='suspect';}
    save();render();return;
  };
  c.querySelectorAll('button[data-sus]').forEach(b=>b.onclick=function(){
    const i=parseInt(b.dataset.sus);const name=DATA.DOSSIER[i][0];const hint=M.wrong_hints[name];
    if(hint===null||hint===undefined||hint===false){
      S.susOK=true;S.meet='place';save();render();return;
    }
    S.susHint=hint;save();render();
  });
  c.querySelectorAll('button[data-pl]').forEach(b=>b.onclick=function(){
    const i=parseInt(b.dataset.pl);const o=DATA.MEETING.place_opts[i];
    if(o[1]){S.meet='done';save();render();}
    else{const fb=document.getElementById('fb_pl');fb.innerHTML='<div class="fb bad"><b>Терминал:</b> '+esc(o[2])+'</div>';b.classList.add('wrong');}
  });
  const back=document.getElementById('mBack');
  if(back)back.onclick=function(){S.meet=null;S.view=null;save();render();};
}

/* ---------- ПАПКА ---------- */
function renderFolder(){
  const c=document.getElementById('content');
  let h='<div class="sheet"><h3>Папка дела ('+S.opened.length+'/33)</h3>';
  if(!S.opened.length){h+='<p>Папка пуста. Вскрывайте улики в «Поле и коды».</p>';}
  else{
    h+='<div>';
    R().nums.filter(n=>S.opened.includes(n)).forEach(n=>{
      h+='<button class="opt" data-f="'+n+'">№'+n+' — '+esc(E(n).title)+'</button>';
    });
    h+='</div>';
  }
  h+='<button id="fBack">← К делу</button></div>';
  c.innerHTML=h;
  c.querySelectorAll('button[data-f]').forEach(b=>b.onclick=function(){S.curEvid=b.dataset.f;S.view='evview';save();render();});
  document.getElementById('fBack').onclick=function(){S.view=null;save();render();};
}
function renderEvView(){
  const c=document.getElementById('content');const ev=E(S.curEvid);
  c.innerHTML='<div class="sheet"><h3>'+esc(ev.title)+' — №'+ev.num+'</h3><div class="evplace">'+esc(ev.place)+'</div><div class="evbody">'+bodyHTML(ev)+'</div><button id="fBack">← В папку</button></div>';
  document.getElementById('fBack').onclick=function(){S.view='folder';save();render();};
}

/* ---------- ДОКУМЕНТЫ ---------- */
function renderDocs(){
  const c=document.getElementById('content');
  const letter=DATA.LETTER.replace('<SUSPECT>',R().suspect).replace('<ZONES>',R().zones);
  const map=DATA.MAP_DOC.replace('<ZONES>',R().zones);
  let h='<div class="sheet"><h3>Документы</h3>';
  h+='<div class="doc"><h3>Приветственное письмо штаба</h3><div class="evbody">'+letter.split('\n').filter(x=>x.trim()!=='').map(x=>'<p>'+esc(x)+'</p>').join('')+'</div></div>';
  h+='<div class="doc"><h3>Досье подозреваемых (13 карточек)</h3><div class="dossier">';
  DATA.DOSSIER.forEach(d=>{h+='<div class="dcard"><b>'+esc(d[0])+'</b><br><span class="small">'+esc(d[1])+' · '+esc(d[2])+'</span><p class="small">'+esc(d[3])+'</p></div>';});
  h+='</div></div>';
  h+='<div class="doc"><h3>Карта школы</h3><div class="evbody">'+map.split('\n').filter(x=>x.trim()!=='').map(x=>'<p>'+esc(x)+'</p>').join('')+'</div></div>';
  h+='<div class="doc"><h3>Памятка ведущего (служебная)</h3><div class="evbody">'+DATA.MEMO.split('\n').filter(x=>x.trim()!=='').map(x=>'<p>'+esc(x)+'</p>').join('')+'</div></div>';
  h+='</div>';
  c.innerHTML=h;
}

/* ---------- МЕНЮ ---------- */
function renderMenu(){
  const c=document.getElementById('content');
  c.innerHTML='<div class="sheet"><h3>Меню</h3>'+
    '<button class="opt" id="mnCont">Продолжить следствие</button>'+
    '<button class="opt" id="mnExit">Выйти на главный экран (прогресс сохранится)</button>'+
    '<button class="opt" id="mnReset">Сбросить дело</button>'+
    '<div class="msg" id="mnMsg"></div></div>';
  document.getElementById('mnCont').onclick=function(){S.view=null;save();render();};
  document.getElementById('mnExit').onclick=function(){S.view=null;S=null;render();};
  document.getElementById('mnReset').onclick=function(){
    const m=document.getElementById('mnMsg');
    if(!m.dataset.arm){m.textContent='Дело будет сброшено без возможности возврата. Нажмите кнопку ещё раз, чтобы подтвердить.';m.className='msg err';m.dataset.arm='1';return;}
    try{localStorage.removeItem(SKEY);}catch(e){}
    S=null;render();
  };
}

/* ---------- РЕНДЕР ---------- */
function render(){
  const app=document.getElementById('app');
  try{
    if(!S){app.innerHTML=startHTML();bindStart();return;}
    if(S.confirming){app.innerHTML=confirmHTML();bindConfirm();return;}
    if(S.view==='evview'){app.innerHTML=mainHTML();bindMain();return;}
    app.innerHTML=mainHTML();bindMain();
  }catch(e){showErr(e.message);}
}
render();
</script>
</body>
